<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* Dasar tampilan untuk Cuan dan Toko. Warna diatur lewat token di style.css masing-masing. */
:root {
  --bg: #f4f1ee; --card: #ffffff; --fg: #231a14; --mute: #7a6d64; --line: #e8e1db;
  --p1: #b84a00; --p2: #e8630a; --pfg: #ffffff; --accent: #f2b705; --good: #1b8a4b; --bad: #d23b2e; --soft: #fdeee0;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17120f; --card: #221b17; --fg: #f3ece6; --mute: #a39588; --line: #362d27; --soft: #33251a; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.tab-num { font-variant-numeric: tabular-nums; }
.shell { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg); position: relative; padding-bottom: 72px; }
.strip { background: linear-gradient(90deg, var(--p1), var(--p2)); color: var(--pfg); font-size: 12px; padding: 7px 16px; text-align: center; }
.strip.demo { background: #333; }
main { padding: 0 0 8px; }
.pad { padding: 14px 16px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { display: flex; width: 100%; max-width: 480px; }
.tab { flex: 1; border: 0; background: none; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--mute); position: relative; }
.tab .ic { font-size: 20px; line-height: 1; filter: grayscale(1) opacity(.7); }
.tab.on { color: var(--p2); font-weight: 600; }
.tab.on .ic { filter: none; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.mute { color: var(--mute); }
.sm { font-size: 12px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 0; border-radius: 10px; background: linear-gradient(180deg, var(--p2), var(--p1)); color: var(--pfg); padding: 11px 16px; font-weight: 600; min-height: 42px; }
.btn.ghost { background: var(--card); color: var(--p1); border: 1px solid var(--p2); }
.btn.dark { background: #2b2b2b; }
.btn.bad { background: var(--bad); }
.btn.good { background: var(--good); color: #fff; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--mute); }
.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 42px; color: var(--fg); }
textarea.in { min-height: 84px; resize: vertical; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 12px; }
.chip.on { background: var(--soft); border-color: var(--p2); color: var(--p1); font-weight: 600; }
.scrollx { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.scrollx::-webkit-scrollbar { display: none; }
.scrollx > * { flex: none; }
.err { color: var(--bad); font-size: 12px; min-height: 16px; }

.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; max-height: 90%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .18s ease-out; }
.sheet.full { height: 90%; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.sheet-b { padding: 4px 16px 16px; overflow-y: auto; }
.x { border: 0; background: var(--bg); width: 30px; height: 30px; border-radius: 50%; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 481px) { .screen { box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); } }
.screen-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(90deg, var(--p1), var(--p2)); color: var(--pfg); }
.screen-h b { flex: 1; font-size: 16px; }
.screen-h .back { border: 0; background: rgba(255,255,255,.18); color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; }
.screen-r { font-size: 13px; font-variant-numeric: tabular-nums; }
.screen-b { flex: 1; overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 12px); background: #222; color: #fff; padding: 9px 16px; border-radius: 10px; z-index: 99; opacity: 0; pointer-events: none; transition: .2s; max-width: 86vw; font-size: 13px; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.auth { max-width: 420px; margin: 0 auto; padding: 0 0 30px; min-height: 100%; }
.auth-hero { background: linear-gradient(160deg, var(--p1), var(--p2)); color: var(--pfg); padding: 40px 24px 70px; }
.auth-hero h1 { font-size: 26px; }
.auth-hero p { margin: 6px 0 0; opacity: .9; }
.auth-card { margin: -44px 16px 0; padding: 18px; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; color: var(--mute); }
.seg button.on { background: var(--card); color: var(--p1); font-weight: 600; box-shadow: var(--shadow); }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; background: none; border: 0; text-align: left; }
.li .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; font-size: 18px; flex: none; }
.li .t { flex: 1; min-width: 0; }
.li .t small { display: block; color: var(--mute); }
.li .chev { color: var(--mute); }
.empty { text-align: center; color: var(--mute); padding: 40px 16px; }
.foot { text-align: center; color: var(--mute); font-size: 11px; padding: 18px 16px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Cuan: hijau tua + emas, nuansa meja kasino yang tenang */
:root { --p1: #0a5c45; --p2: #11a077; --pfg: #fff; --accent: #f2b705; --soft: #e3f4ee; --bg: #eef3f0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e1613; --card: #17231e; --soft: #1b3027; --line: #28382f; --fg: #e9f3ee; --mute: #8fa59a; } }

.hero { background: linear-gradient(160deg, var(--p1), var(--p2)); color: #fff; padding: 18px 16px 22px; }
.hero .wallet { background: var(--card); color: var(--fg); border-radius: 12px; padding: 12px 14px; margin: 14px 0 -40px; box-shadow: var(--shadow); }
.hero .wallet b { font-size: 24px; }
.hero + .pad { padding-top: 36px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 22px; font-weight: 700; border: 2px solid rgba(255,255,255,.5); }

.games { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.game { text-align: left; border: 0; background: var(--card); border-radius: 12px; padding: 14px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; min-height: 124px; }
.game .gi { font-size: 30px; line-height: 1.1; margin-bottom: 4px; }
.game small { color: var(--mute); line-height: 1.3; }
.game:active { transform: scale(.98); }

/* slot */
.slot { display: flex; flex-direction: column; gap: 12px; }
.slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: linear-gradient(160deg, #0a5c45, #073d2e); padding: 8px; border-radius: 14px; box-shadow: inset 0 0 0 2px #f2b70566; }
.cell { aspect-ratio: 1; display: grid; place-items: center; font-size: clamp(28px, 10vw, 44px); background: #fff; border-radius: 10px; font-weight: 800; color: #111; transition: transform .15s, box-shadow .15s; user-select: none; }
.cell.win { background: #fff6cc; box-shadow: 0 0 0 3px #f2b705; transform: scale(1.04); }
.cell.mult { background: #ffe0d6; box-shadow: 0 0 0 3px #e8630a; color: #b13a00; }
.cell.bell { background: #d9f3ff; box-shadow: 0 0 0 3px #1e88e5; }
.slot-msg { min-height: 44px; text-align: center; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 15px; }
.slot-free { background: #fff6cc; color: #6a4d00; border-radius: 10px; padding: 7px; text-align: center; font-weight: 700; }

/* crash */
.crash-box { position: relative; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.crash-box canvas { width: 100%; height: auto; display: block; }
.crash-m { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-size: 40px; font-weight: 800; }
.crash-m.crashed { color: var(--bad); } .crash-m.won { color: var(--good); }
.crash-s { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; color: var(--mute); padding: 0 10px; }

/* uno */
.uno { display: flex; flex-direction: column; gap: 12px; }
.uno-opps { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.opp { background: var(--card); border-radius: 12px; padding: 8px 12px; text-align: center; min-width: 96px; box-shadow: var(--shadow); border: 2px solid transparent; }
.opp.turn { border-color: var(--accent); }
.opp .mini { font-size: 18px; letter-spacing: -5px; line-height: 1.2; }
.uno-mid { display: flex; justify-content: center; align-items: center; gap: 28px; padding: 10px 0; }
.deck { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.deck:disabled { opacity: .6; }
.disc { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.curcol { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: #fff; text-transform: uppercase; }
.curcol.R { background: #e53935; } .curcol.Y { background: #f9a825; color: #222; } .curcol.G { background: #2e9e43; } .curcol.B { background: #1e6fd9; }
.ucard { width: 56px; height: 84px; border-radius: 9px; border: 3px solid #fff; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; box-shadow: 0 2px 6px rgba(0,0,0,.3); flex: none; position: relative; }
.ucard.R { background: #e53935; } .ucard.Y { background: #f9a825; color: #222; } .ucard.G { background: #2e9e43; } .ucard.B { background: #1e6fd9; }
.ucard.W { background: conic-gradient(#e53935 0 25%, #f9a825 0 50%, #2e9e43 0 75%, #1e6fd9 0); }
.ucard.W span { background: rgba(0,0,0,.55); border-radius: 6px; padding: 0 6px; }
.ucard.back { background: #222; color: #f2b705; font-size: 14px; letter-spacing: 1px; }
.uno-hand { display: flex; gap: 6px; overflow-x: auto; padding: 14px 4px 8px; min-height: 112px; }
.uno-hand .ucard.ok { transform: translateY(-8px); cursor: pointer; outline: 3px solid var(--accent); }
.uno-hand .ucard.no { opacity: .55; }
.uno-log { text-align: center; color: var(--mute); font-size: 12px; min-height: 18px; }
.uno-st { text-align: center; font-weight: 700; padding: 8px; border-radius: 10px; background: var(--card); }
.uno-st.my { background: var(--accent); color: #2a2000; }
.colpick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.colpick .ucard { width: 100%; height: 70px; font-size: 12px; cursor: pointer; }

</style>
</head>
